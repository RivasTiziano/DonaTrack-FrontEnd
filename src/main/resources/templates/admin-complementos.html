<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/dashboard-admin-layout :: layout(~{::title}, ~{::main}, ${activeTab})}">
    <head>
        <title th:text="${pageTitle} + ' - DonaTrack'">
        </title>
    </head>
    <body>
        <section th:fragment="main" class="api-view">
            <header th:replace="~{fragments/admin-ui :: header(${pageTitle}, 'Consulta y gestión de datos registrados en los servicios.')}">
            </header>
            <div th:replace="~{fragments/admin-ui :: mensajes}">
            </div>
            <th:block th:if="${section == 'asignaciones' or section == 'sugerencias' or section == 'sugerencia'}">
                <nav th:replace="~{fragments/admin-ui :: matchTabs(${section})}">
                </nav>
            </th:block>
            <th:block th:if="${section == 'historialRanking'}">
                <nav th:replace="~{fragments/admin-ui :: rankingTabs(${section})}">
                </nav>
            </th:block>
            <th:block th:replace="~{fragments/consultas-donaciones :: contenido}">
            </th:block>
            <th:block th:replace="~{fragments/consultas-logistica :: contenido}">
            </th:block>
            <th:block th:replace="~{fragments/consultas-incentivos :: contenido}">
            </th:block>
        </section>
    </body>
</html>
