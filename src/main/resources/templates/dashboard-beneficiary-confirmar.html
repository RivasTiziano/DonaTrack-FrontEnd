<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/dashboard-beneficiary-layout :: layout(~{::title}, ~{::main}, 'confirm')}">
<head>
    <title>DonaTrack - Confirmar Recepción</title>
</head>
<body>
    <main class="beneficiary-confirm-view" th:fragment="main">
        <!-- Breadcrumbs -->

        <!-- Header -->
        <div style="margin-bottom: 1.5rem;">
            <h1 style="font-size: 1.5rem; font-weight: 800; color: var(--color-ink);">Confirmar recepción</h1>
        </div>

        <!-- Onboarding Hint -->
        <!-- Entregas en traslado: cada asignación tiene su propio formulario de Recibida o No recibida -->
        <div class="card" style="background: #ffffff; padding: 1.5rem; border-radius: var(--radius-lg); border: 1px solid var(--color-border); display: flex; flex-direction: column; gap: 1rem;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2 style="font-size: 1.15rem; font-weight: 700;">En traslado a tu sede</h2>
                <span class="status-badge badge-traslado" th:text="${assignedDonations.size()} + ' en traslado'">0 en traslado</span>
            </div>

            <p th:if="${assignedDonations.isEmpty()}" style="font-size: 0.875rem; color: var(--color-muted);">No hay entregas en traslado para confirmar.</p>
            <div style="display: flex; flex-direction: column; gap: 0.75rem;">
                <div class="confirm-item-card" th:each="donation : ${assignedDonations}"
                     style="padding: 1rem; border-radius: var(--radius-md); border: 1px solid var(--color-border); background: #f8fafc;">
                    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px;">
                        <h4 style="font-size: 0.95rem; font-weight: 700; color: var(--color-ink);" th:text="${donation.title ?: 'Donación'}">Donación</h4>
                        <span class="status-badge badge-traslado" th:text="${donation.status_label}">En traslado</span>
                    </div>
                    <p style="font-size: 0.8125rem; color: var(--color-muted);">
                        <span th:text="${@unidades.formatear(donation.items_count, donation.unit)}">50 unidades</span>
                    </p>

                    <p th:if="${donation.entregaId == null}" class="form-hint">La entrega todavía no está disponible para confirmar.</p>

                    <div th:if="${donation.entregaId != null}">
                        <!-- Confirmación con una imagen guardada por el frontend. -->
                        <form method="post" enctype="multipart/form-data" th:action="@{/entidad/dashboard/confirmar}" class="form-group receipt-photo-form" data-loading-text="Confirmando…">
                            <input type="hidden" name="asignacionId" th:value="${donation.id}" />
                            <input type="hidden" name="resultado" value="RECIBIDA" />
                            <label class="form-label" th:for="'foto-' + ${donation.id}">Imagen de la donación recibida</label>
                            <input th:id="'foto-' + ${donation.id}" type="file" name="imagen" accept="image/jpeg,image/png" class="form-control" data-receipt-image required />
                            <small class="form-hint">JPG o PNG, hasta 10 MB.</small>
                            <img class="receipt-image-preview" alt="Vista previa de la donación recibida" hidden />
                            <div>
                                <button type="submit" class="btn btn-primary">Confirmar recepción</button>
                            </div>
                        </form>

                        <details class="receipt-not-received">
                        <summary>No recibí la donación</summary>
                        <!-- No recibida: exige justificación; queda para revisión del admin -->
                        <form method="post" th:action="@{/entidad/dashboard/confirmar}" class="form-group">
                            <input type="hidden" name="asignacionId" th:value="${donation.id}" />
                            <input type="hidden" name="resultado" value="NO_RECIBIDA" />
                            <label class="form-label" th:for="'justificacion-' + ${donation.id}">Justificación (por qué no fue recibida)</label>
                            <textarea th:id="'justificacion-' + ${donation.id}" name="justificacion" class="form-control" rows="2" required></textarea>
                            <div>
                                <button type="submit" class="btn">Enviar justificación</button>
                            </div>
                        </form>
                        </details>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
