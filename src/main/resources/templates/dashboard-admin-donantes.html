<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/dashboard-admin-layout :: layout(~{::title}, ~{::main}, 'donors')}">
    <head>
        <title>Administrar Donantes - DonaTrack</title>
    </head>
    <body>
        <section th:fragment="main" class="api-view">
            <header th:replace="~{fragments/admin-ui :: header('Personas donantes', 'Registro, contactos y acceso de personas humanas y jurídicas.')}">
            </header>
            <div class="toolbar donor-create-actions">
                <a class="btn btn-primary" th:href="@{/admin/dashboard/donantes/nuevo/humanos}">Nuevo donante</a>
                <a class="btn btn-outline" th:href="@{/admin/dashboard/donantes/nuevo/juridicos}">Nuevo donante jurídico</a>
                <a th:if="${sesion.tiene('IMPORTAR_DONANTES_CSV')}" class="btn btn-outline" th:href="@{/admin/dashboard/importar}">Importar CSV</a>
            </div>
            <div th:replace="~{fragments/admin-ui :: mensajes}">
            </div>
            <p th:if="${errorDonantes != null}" class="api-error" role="alert" th:text="${errorDonantes}">
            </p>
            <section class="card api-panel">
                <form method="get" th:action="@{/admin/dashboard/donantes}" class="toolbar donor-search-toolbar">
                    <label>Buscar donante<input class="form-control" type="search" name="q" th:value="${q}" placeholder="Nombre, documento, email o teléfono"/>
                    </label>
                    <label>Tipo<select class="form-control" name="tipo" onchange="this.form.submit()">
                        <option value="" th:selected="${tipo == null or tipo == ''}">Todos</option>
                        <option value="HUMANA" th:selected="${tipo == 'HUMANA' or tipo == 'Humana'}">Donantes</option>
                        <option value="JURIDICA" th:selected="${tipo == 'JURIDICA' or tipo == 'Jurídica' or tipo == 'Juridica'}">Donantes jurídicos</option>
                    </select>
                    </label>
                    <label>Por página<select class="form-control" name="size" onchange="this.form.submit()">
                        <option value="20" th:selected="${size == 20}">20</option>
                        <option value="50" th:selected="${size == 50}">50</option>
                        <option value="100" th:selected="${size == 100}">100</option>
                    </select>
                    </label>
                    <input type="hidden" name="page" value="0"/>
                    <div class="donor-search-actions">
                        <button type="submit" class="btn btn-primary">Buscar</button>
                        <a th:if="${(q != null and !q.isEmpty()) or (tipo != null and !tipo.isEmpty())}" class="btn btn-outline" th:href="@{/admin/dashboard/donantes(size=${size})}">Limpiar</a>
                    </div>
                </form>
        <div class="empty-state" th:if="${#lists.isEmpty(donorsList) and errorDonantes == null and apiError == null}">
            <i data-lucide="users" aria-hidden="true">
            </i>
            <p th:text="${(q != null and !q.isEmpty()) or (tipo != null and !tipo.isEmpty()) ? 'No se encontraron donantes con esos filtros.' : 'Todavía no hay donantes registrados.'}">Todavía no hay donantes registrados.</p>
            <a class="btn btn-primary" th:if="${(q == null or q.isEmpty()) and (tipo == null or tipo.isEmpty())}" th:href="@{/admin/dashboard/donantes/nuevo/humanos}">Registrar un donante</a>
        </div>
        <div class="api-table" th:if="${!#lists.isEmpty(donorsList)}">
            <table id="donors-table" class="data-table" data-no-paginate>
                <thead>
                    <tr>
                        <th scope="col">Nombre / Razón social</th>
                        <th scope="col">Tipo</th>
                        <th scope="col">Documento</th>
                        <th scope="col">Contacto</th>
                        <th scope="col">Registro</th>
                        <th scope="col">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="donor : ${donorsList}" th:data-type="${donor.type}" data-record>
                        <td data-label="Nombre">
                            <strong th:text="${donor.name}">
                            </strong>
                        </td>
                        <td data-label="Tipo" th:text="${donor.type == 'Humana' ? 'Donante' : 'Donante jurídico'}">
                        </td>
                        <td data-label="Documento" th:text="${donor.docType + ': ' + donor.doc}">
                        </td>
                        <td data-label="Contacto">
                            <span class="donor-email" th:text="${donor.email != null and !donor.email.isBlank() ? donor.email : 'Sin email'}">
                            </span>
                            <small class="muted" th:if="${donor.phone != null and !donor.phone.isBlank()}" th:text="${donor.phone}">
                            </small>
                        </td>
                        <td data-label="Registro">
                            <span class="registration-state" th:text="${donor.estadoRegistro == 'PENDIENTE_COMPLETAR' ? 'Pendiente de completar' : 'Completo'}"></span>
                        </td>
                        <td data-label="Acciones">
                            <div class="row-actions">
                                <a class="btn btn-outline action-access" th:href="@{/admin/dashboard/donantes/{tipo}/{id}/acceso(tipo=${donor.type == 'Humana' ? 'humanos' : 'juridicos'},id=${donor.id})}">Enviar acceso</a>
                                <a class="btn btn-outline action-icon action-edit" th:href="@{/admin/dashboard/donantes/{tipo}/{id}(tipo=${donor.type == 'Humana' ? 'humanos' : 'juridicos'},id=${donor.id})}" aria-label="Ver o editar" title="Ver o editar"><svg th:replace="~{fragments/ui-icons :: edit}"></svg></a>
                                <form method="post" th:action="@{/admin/dashboard/donantes/{tipo}/{id}/eliminar(tipo=${donor.type == 'Humana' ? 'humanos' : 'juridicos'},id=${donor.id})}" onsubmit="return confirm('¿Eliminar este donante?');">
                                            <button type="submit" class="btn btn-outline action-icon action-delete" aria-label="Eliminar" title="Eliminar"><svg th:replace="~{fragments/ui-icons :: delete}"></svg></button>
                                        </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <nav class="pagination-bar" th:if="${totalElements != null and totalElements > 0}" aria-label="Paginación de donantes">
            <span class="pagination-summary" th:text="'Mostrando ' + ${page * size + 1} + '–' + ${page * size + donorsList.size()} + ' de ' + ${totalElements} + ' donantes'"></span>
            <div class="pagination-controls" th:if="${totalPages > 1}">
                <a class="btn btn-outline btn-sm" th:if="${page > 0}" th:href="@{/admin/dashboard/donantes(q=${q}, tipo=${tipo}, page=${page - 1}, size=${size})}">Anterior</a>
                <span class="btn btn-outline btn-sm is-disabled" aria-disabled="true" th:if="${page <= 0}">Anterior</span>
                <span class="pagination-page" th:text="'Página ' + ${page + 1} + ' de ' + ${totalPages}"></span>
                <a class="btn btn-outline btn-sm" th:if="${page + 1 < totalPages}" th:href="@{/admin/dashboard/donantes(q=${q}, tipo=${tipo}, page=${page + 1}, size=${size})}">Siguiente</a>
                <span class="btn btn-outline btn-sm is-disabled" aria-disabled="true" th:if="${page + 1 >= totalPages}">Siguiente</span>
            </div>
        </nav>
    </section>
</section>
</body>
</html>
