<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/dashboard-admin-layout :: layout(~{::title}, ~{::main}, 'donors')}">
    <head>
        <title>Administrar Donantes - DonaTrack</title>
    </head>
    <body>
        <section th:fragment="main" class="api-view">
            <header th:replace="~{fragments/admin-ui :: header('Personas donantes', 'Registro, contactos y acceso de personas humanas y jurídicas.')}">
            </header>
            <div class="toolbar">
                <a class="btn btn-primary" th:href="@{/admin/dashboard/donantes/nuevo/humanos}">Nuevo donante</a>
                <a class="btn btn-outline" th:href="@{/admin/dashboard/donantes/nuevo/juridicos}">Nuevo donante jurídico</a>
                <a th:if="${sesion.tiene('IMPORTAR_DONANTES_CSV')}" class="btn btn-outline" th:href="@{/admin/dashboard/importar}">Importar CSV</a>
            </div>
            <div th:replace="~{fragments/admin-ui :: mensajes}">
            </div>
            <p th:if="${errorDonantes != null}" class="api-error" role="alert" th:text="${errorDonantes}">
            </p>
            <section class="card api-panel">
                <div class="toolbar">
                    <label>Buscar donante<input class="form-control" type="search" data-filter-table="donors-table" placeholder="Nombre, documento o contacto"/>
                </label>
                <label>Tipo<select class="form-control" data-filter-table="donors-table" data-field="type">
                    <option value="">Todos</option>
                    <option value="Humana">Donantes</option>
                    <option value="Jurídica">Donantes jurídicos</option>
                </select>
            </label>
        </div>
        <div class="empty-state" th:if="${#lists.isEmpty(donorsList) and errorDonantes == null and apiError == null}">
            <i data-lucide="users" aria-hidden="true">
            </i>
            <p>Todavía no hay donantes registrados.</p>
            <a class="btn btn-primary" th:href="@{/admin/dashboard/donantes/nuevo/humanos}">Registrar un donante</a>
        </div>
        <div class="api-table">
            <table id="donors-table" class="data-table">
                <thead>
                    <tr>
                        <th scope="col">Nombre / Razón social</th>
                        <th scope="col">Tipo</th>
                        <th scope="col">Documento</th>
                        <th scope="col">Contacto</th>
                        <th scope="col">Registro</th>
                        <th scope="col">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="donor : ${donorsList}" th:data-type="${donor.type}" data-record>
                        <td data-label="Nombre">
                            <strong th:text="${donor.name}">
                            </strong>
                        </td>
                        <td data-label="Tipo" th:text="${donor.type == 'Humana' ? 'Donante' : 'Donante jurídico'}">
                        </td>
                        <td data-label="Documento" th:text="${donor.docType + ': ' + donor.doc}">
                        </td>
                        <td data-label="Contacto">
                            <span th:text="${donor.email}">
                            </span>
                            <small class="muted" th:text="${donor.phone}">
                            </small>
                        </td>
                        <td data-label="Registro">
                            <span class="registration-state" th:text="${donor.estadoRegistro == 'PENDIENTE_COMPLETAR' ? 'Pendiente de completar' : 'Completo'}"></span>
                        </td>
                        <td data-label="Acciones">
                            <div class="row-actions">
                                <a class="btn btn-outline action-icon action-edit" th:href="@{/admin/dashboard/donantes/{tipo}/{id}(tipo=${donor.type == 'Humana' ? 'humanos' : 'juridicos'},id=${donor.id})}" aria-label="Ver o editar" title="Ver o editar"><svg th:replace="~{fragments/ui-icons :: edit}"></svg></a>
                                <a class="btn btn-outline" th:href="@{/admin/dashboard/donantes/{tipo}/{id}/acceso(tipo=${donor.type == 'Humana' ? 'humanos' : 'juridicos'},id=${donor.id})}">Crear acceso</a>
                                <details class="row-menu">
                                    <summary aria-label="Más acciones">⋯</summary>
                                    <div class="menu-content">
                                        <form method="post" th:action="@{/admin/dashboard/donantes/{tipo}/{id}/eliminar(tipo=${donor.type == 'Humana' ? 'humanos' : 'juridicos'},id=${donor.id})}" onsubmit="return confirm('¿Eliminar este donante?');">
                                            <button type="submit" class="btn btn-outline action-icon action-delete" aria-label="Eliminar" title="Eliminar"><svg th:replace="~{fragments/ui-icons :: delete}"></svg></button>
                                        </form>
                                    </div>
                                </details>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <p data-filter-empty="donors-table" hidden role="status">No se encontraron donantes con esos filtros.</p>
    </section>
</section>
</body>
</html>
