<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/dashboard-donor-layout :: layout(~{::title}, ~{::main}, 'entregas')}">
<head>
    <title>DonaTrack - Seguimiento de Entregas</title>
</head>
<body>
    <main class="donor-deliveries-view" th:fragment="main">
        <!-- Breadcrumbs -->

        <!-- Header -->
        <div class="dt-page-header">
            <div>
                <h1 style="font-size: clamp(1.2rem, 4.5vw, 1.5rem); font-weight: 800; color: var(--color-ink); word-break: break-word; line-height: 1.25;">Seguimiento de Entregas</h1>
            </div>
            <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                <a th:href="@{/donante/dashboard/entregas}" class="gps-refresh-link">
                    <span>Actualizar</span>
                    <i data-lucide="rotate-ccw" style="width: 15px; height: 15px;" aria-hidden="true"></i>
                </a>
            </div>
        </div>

        <!-- Onboarding Hint -->
        <!-- Search & Filter Bar -->
        <section class="card donor-delivery-filters" style="background: #ffffff; border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 1.25rem; margin-bottom: 1.5rem; ">
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; align-items: end;">
                <div style="grid-column: span 1 / -1;">
                    <label for="delivery-search" style="display: block; font-size: 0.8125rem; font-weight: 700; color: var(--color-ink); margin-bottom: 0.35rem;">
                        <i data-lucide="search" style="width: 14px; height: 14px; display: inline-block; vertical-align: middle;"></i> Buscar por donación, bien o entidad destino
                    </label>
                    <input type="text" id="delivery-search" class="form-control" placeholder="Ej: Fideos, Fundación..." style="width: 100%; font-size: 0.875rem; padding: 0.55rem 0.85rem; border-radius: var(--radius-md); border: 1px solid var(--color-border);" oninput="applyDeliverySearch()" />
                </div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 1rem; padding-top: 0.75rem; border-top: 1px solid var(--color-border); flex-wrap: wrap; gap: 0.5rem;">
                <div class="filter-tabs" style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                    <button type="button" class="btn btn-outline btn-sm delivery-tab active" onclick="filterDeliveriesByStatus('all', this)">
                        Todas (<span th:text="${activeDonorDeliveries.size()}">0</span>)
                    </button>
                    <button type="button" class="btn btn-outline btn-sm delivery-tab" onclick="filterDeliveriesByStatus('PLANIFICADA', this)">
                        Planificadas
                    </button>
                    <button type="button" class="btn btn-outline btn-sm delivery-tab" onclick="filterDeliveriesByStatus('EN_TRASLADO', this)">
                        <span style="width: 8px; height: 8px; border-radius: 50%; background: #10b981; display: inline-block;"></span>
                        En traslado
                    </button>
                </div>
                <div style="font-size: 0.8125rem; color: var(--color-muted);">
                    Mostrando <strong id="delivery-count" style="color: var(--color-ink);" th:text="${activeDonorDeliveries.size()}">0</strong> envíos
                </div>
            </div>
        </section>

        <!-- Estado vacío: no hay entregas en camino para la cuenta -->
        <p th:if="${activeDonorDeliveries.isEmpty()}" class="card" style="padding: 1.5rem; background: #ffffff; border: 1px dashed var(--color-border); border-radius: var(--radius-lg); color: var(--color-muted); font-size: 0.875rem;">No tenés entregas en camino en este momento.</p>

        <div th:unless="${activeDonorDeliveries.isEmpty()}" class="dt-grid-1-8-1" id="delivery-results">
            <!-- Mapa: un marcador de destino y otro de camión por cada entrega -->
            <div class="card" style="background: #ffffff; border: 1px solid var(--color-border); border-radius: var(--radius-lg); overflow: hidden;  display: flex; flex-direction: column; min-height: 480px;">
                <div style="padding: 1rem 1.25rem; border-bottom: 1px solid var(--color-border); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem;">
                    <strong style="font-size: 0.9375rem; color: var(--color-ink);" id="map-title">Destino de la entrega</strong>
                </div>
                <div id="donor-tracking-map" style="flex: 1; min-height: 420px; width: 100%; z-index: 1;"></div>
            </div>

            <div style="display: flex; flex-direction: column; gap: 1rem;">
                <!-- Detalles de todas las entregas, sin selector intermedio. -->
                <div class="card delivery-select-item donor-delivery-details" th:each="del : ${activeDonorDeliveries}" th:data-status="${del.status}" style="background: #ffffff; border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 1.5rem;  display: flex; flex-direction: column; gap: 1rem;">
                    <div>
                        <span class="status-badge" th:classappend="${del.status_badge}" th:text="${del.status_label}">Estado</span>
                        <h3 style="font-size: 1.15rem; font-weight: 800; color: var(--color-ink); margin-top: 6px;" th:text="${del.donationTitle ?: 'Donación'}">Donación</h3>
                    </div>

                    <div style="background: #f8fafc; border-radius: var(--radius-md); padding: 1rem; border: 1px solid var(--color-border); display: flex; flex-direction: column; gap: 0.5rem; font-size: 0.8125rem;">
                        <div style="display: flex; justify-content: space-between; gap: 0.5rem;">
                            <span style="color: var(--color-muted);">Entidad destino:</span>
                            <strong style="color: var(--color-ink); text-align: right;" th:text="${del.destinationEntity ?: '—'}">Entidad</strong>
                        </div>
                        <div style="display: flex; justify-content: space-between; gap: 0.5rem;">
                            <span style="color: var(--color-muted);">Dirección:</span>
                            <span style="text-align: right;" th:text="${del.destinationAddress ?: '—'}">Dirección</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; gap: 0.5rem;">
                            <span style="color: var(--color-muted);">Camión:</span>
                            <span style="text-align: right;" th:text="${del.truck?.lat == null ? 'Sin posición todavía' : 'Camión ' + del.truck.plate + ' · ' + del.truck.lastUpdateAgo}">Sin posición todavía</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <p id="delivery-filter-empty" hidden role="status" th:unless="${activeDonorDeliveries.isEmpty()}">No hay entregas que coincidan con los filtros seleccionados.</p>

        <script th:inline="javascript">
            // Entregas en camino del dueño (API). Sin datos de maqueta.
            const entregas = /*[[${activeDonorDeliveries}]]*/ [];
            const CENTRO_PREDETERMINADO = [-34.6037, -58.3816];
            let mapaSeguimiento = null;
            // marcadores[i] corresponde a entregas[i]: { destino, camion }, cada uno puede ser null.
            const marcadores = [];

            function tieneCoords(p) {
                return p != null && p.lat != null && p.lng != null;
            }

            function crearPopup(lineas) {
                const div = document.createElement('div');
                lineas.forEach(texto => {
                    const linea = document.createElement('div');
                    linea.textContent = texto;
                    div.appendChild(linea);
                });
                return div;
            }

            function dibujarMarcadores() {
                const puntos = [];
                entregas.forEach(e => {
                    const marca = { destino: null, camion: null };
                    if (tieneCoords(e.destinationCoords)) {
                        const pos = [e.destinationCoords.lat, e.destinationCoords.lng];
                        marca.destino = L.marker(pos).addTo(mapaSeguimiento)
                            .bindPopup(crearPopup(['Destino: ' + (e.destinationEntity || '—'), e.destinationAddress || '']));
                        puntos.push(pos);
                    }
                    if (e.truck && tieneCoords(e.truck)) {
                        const pos = [e.truck.lat, e.truck.lng];
                        marca.camion = L.marker(pos, {autoPanOnFocus: false, icon: L.icon({iconUrl:'/img/camion-mapa.webp?v=4',iconSize:[40,40],iconAnchor:[20,20],popupAnchor:[0,-20],className:'truck-map-marker'})})
                            .addTo(mapaSeguimiento)
                            .bindPopup(crearPopup(['Camión ' + (e.truck.plate || '—'),
                                e.truck.lastUpdate ? 'Última actualización: ' + e.truck.lastUpdate : 'Sin fecha de actualización',
                                'Latitud: ' + e.truck.lat + ' · Longitud: ' + e.truck.lng]), {autoPan:false} );
                        puntos.push(pos);
                    }
                    marcadores.push(marca);
                });
                if (puntos.length > 1) mapaSeguimiento.fitBounds(puntos, { padding: [24, 24] });
                else if (puntos.length === 1) mapaSeguimiento.setView(puntos[0], 13);
            }

            function iniciarMapa() {
                const contenedor = document.getElementById('donor-tracking-map');
                if (!contenedor || typeof L === 'undefined') return;
                mapaSeguimiento = L.map(contenedor).setView(CENTRO_PREDETERMINADO, 5);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '&copy; OpenStreetMap'
                }).addTo(mapaSeguimiento);
                dibujarMarcadores();
            }

            let estadoEntregaSeleccionado = 'all';
            function applyDeliverySearch() {
                const query = (document.getElementById('delivery-search').value || '').toLowerCase().trim();
                let count = 0;
                document.querySelectorAll('.delivery-select-item').forEach((item, index) => {
                    const visible = (estadoEntregaSeleccionado === 'all' || item.dataset.status === estadoEntregaSeleccionado)
                        && (!query || item.textContent.toLowerCase().includes(query));
                    item.hidden = !visible;
                    if (visible) count++;
                    if (mapaSeguimiento) {
                        const marca = marcadores[index];
                        [marca?.destino, marca?.camion].filter(Boolean).forEach(layer => {
                            if (visible && !mapaSeguimiento.hasLayer(layer)) layer.addTo(mapaSeguimiento);
                            else if (!visible && mapaSeguimiento.hasLayer(layer)) mapaSeguimiento.removeLayer(layer);
                        });
                    }
                });
                document.getElementById('delivery-count').textContent = count;
                const results = document.getElementById('delivery-results');
                if (results) results.hidden = count === 0;
                const empty = document.getElementById('delivery-filter-empty');
                if (empty) empty.hidden = count !== 0;
                if (mapaSeguimiento) {
                    mapaSeguimiento.closePopup();
                    if (count > 0) requestAnimationFrame(() => mapaSeguimiento.invalidateSize({pan: false}));
                }
            }

            function filterDeliveriesByStatus(status, btn) {
                estadoEntregaSeleccionado = status;
                document.querySelectorAll('.delivery-tab').forEach(b => b.classList.remove('active'));
                if (btn) btn.classList.add('active');
                applyDeliverySearch();
            }

            // Actualización cada 60 s (EXTRA): recarga la página salvo que el usuario esté buscando.
            setInterval(() => {
                const busqueda = document.getElementById('delivery-search');
                if ((!busqueda || !busqueda.value) && estadoEntregaSeleccionado === 'all') location.reload();
            }, 60000);

            document.addEventListener('DOMContentLoaded', iniciarMapa);
        </script>
    </main>
</body>
</html>
