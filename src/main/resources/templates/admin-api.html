<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/dashboard-admin-layout :: layout(~{::title}, ~{::main}, ${activeTab})}">
    <head>
        <title th:text="${pageTitle} + ' - DonaTrack'">
        </title>
    </head>
    <body>
        <section th:fragment="main" class="api-view">
            <header th:replace="~{fragments/admin-ui :: header(${pageTitle},'Consultá datos reales y gestioná las operaciones del módulo.')}">
            </header>
            <div th:replace="~{fragments/admin-ui :: mensajes}">
            </div>
            <th:block th:if="${section == 'asignar'}">
                <nav th:replace="~{fragments/admin-ui :: matchTabs(${section})}">
                </nav>
            </th:block>
            <th:block th:if="${section == 'rankings'}">
                <nav th:replace="~{fragments/admin-ui :: rankingTabs(${section})}">
                </nav>
            </th:block>
            <th:block th:replace="~{fragments/admin-deposito :: contenido}">
            </th:block>
            <th:block th:replace="~{fragments/admin-entidades :: contenido}">
            </th:block>
            <th:block th:replace="~{fragments/admin-logistica :: contenido}">
            </th:block>
            <th:block th:replace="~{fragments/admin-matchmaking :: contenido}">
            </th:block>
            <th:block th:replace="~{fragments/admin-rankings :: contenido}">
            </th:block>
            <th:block th:replace="~{fragments/admin-catalogo :: contenido}">
            </th:block>
        </section>
    </body>
</html>
