<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demasiadas solicitudes - DonaTrack</title>
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/favicon.png}" />
    <link rel="stylesheet" th:href="@{/css/index.css}" />
    <link rel="stylesheet" th:href="@{/css/api-views.css}" />
</head>
<body>
<main class="api-view">
    <h1>Hiciste demasiadas solicitudes seguidas</h1>
    <p class="api-error" role="alert"
       th:text="${message != null ? message : 'Esperá unos segundos y volvé a intentar.'}">Esperá unos segundos y volvé a intentar.</p>
    <p>Este límite protege el sistema frente a abusos. La última operación no se realizó: volvé a intentarla cuando pase el tiempo indicado.</p>
    <a th:href="@{/}">Volver al inicio</a>
</main>
</body>
</html>
