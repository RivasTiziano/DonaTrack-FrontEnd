<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>DonaTrack - Registro de entidad beneficiaria</title>
</head>
<body>
    <main class="registration-page registro-form" th:fragment="main">

        <section class="registro-card">
            <header class="registro-encabezado">
                <span class="registro-etiqueta">Entidad beneficiaria</span>
                <h1>Registrar tu entidad</h1>
            </header>

            <div th:if="${apiError != null}" class="registro-alerta" role="alert">
                <p th:text="${apiError}"></p>
                <div th:if="${cuentaExistente}">
                    <p>¿Ya tenés cuenta? <a th:href="@{/login}">Iniciá sesión</a>.</p>
                    <p>Si te registraron en el depósito, pedí tu acceso a la administración.</p>
                </div>
            </div>

            <form th:action="@{/registro/entidad-beneficiaria}" th:object="${form}" method="post" data-registro-form>
                <div class="registro-grid">
                    <div class="form-group">
                        <label class="form-label" for="razonSocial">Nombre de la entidad (razón social) <span class="required">*</span></label>
                        <input class="form-control" type="text" id="razonSocial" th:field="*{razonSocial}" placeholder="Ej. Comedor Sol" required />
                        <p class="form-error" th:if="${#fields.hasErrors('razonSocial')}" th:errors="*{razonSocial}"></p>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="tipoEntidad">Tipo de entidad <span class="required">*</span></label>
                        <select class="form-control" id="tipoEntidad" th:field="*{tipoEntidad}" required>
                            <option value="">Elegí una opción</option>
                            <option value="ONG">ONG</option>
                            <option value="INSTITUCION">Institución</option>
                            <option value="EMPRESA">Empresa</option>
                            <option value="GUBERNAMENTAL">Gubernamental</option>
                        </select>
                        <p class="form-error" th:if="${#fields.hasErrors('tipoEntidad')}" th:errors="*{tipoEntidad}"></p>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="rubro">Rubro o actividad <span class="required">*</span></label>
                    <input class="form-control" type="text" id="rubro" th:field="*{rubro}" placeholder="Ej. Comedor comunitario" required />
                    <p class="form-error" th:if="${#fields.hasErrors('rubro')}" th:errors="*{rubro}"></p>
                </div>

                <fieldset class="registro-fieldset">
                    <legend>Domicilio</legend>
                    <div class="registro-grid">
                        <div class="form-group">
                            <label class="form-label" for="calle">Calle <span class="required">*</span></label>
                            <input class="form-control" type="text" id="calle" th:field="*{calle}" placeholder="Ej. Av. Rivadavia" required />
                            <p class="form-error" th:if="${#fields.hasErrors('calle')}" th:errors="*{calle}"></p>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="numero">Número <span class="required">*</span></label>
                            <input class="form-control" type="text" id="numero" th:field="*{numero}" placeholder="Ej. 5678" required />
                            <p class="form-error" th:if="${#fields.hasErrors('numero')}" th:errors="*{numero}"></p>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="ciudad">Ciudad <span class="required">*</span></label>
                            <input class="form-control" type="text" id="ciudad" th:field="*{ciudad}" placeholder="Ej. CABA" required />
                            <p class="form-error" th:if="${#fields.hasErrors('ciudad')}" th:errors="*{ciudad}"></p>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="provincia">Provincia <span class="required">*</span></label>
                            <input class="form-control" type="text" id="provincia" th:field="*{provincia}" placeholder="Ej. Buenos Aires" required />
                            <p class="form-error" th:if="${#fields.hasErrors('provincia')}" th:errors="*{provincia}"></p>
                        </div>
                    </div>
                </fieldset>

                <div class="form-group">
                    <label class="form-label" for="email">Email de contacto de la entidad <span class="required">*</span></label>
                    <input class="form-control" type="email" id="email" th:field="*{email}" placeholder="contacto@entidad.org" autocomplete="email" required />
                    <p class="form-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
                </div>

                <fieldset class="registro-fieldset" data-registro-representantes data-registro-minimo="1">
                    <legend>Personas representantes <span class="required">*</span></legend>
                    <div data-registro-bloques>
                        <fieldset class="registro-fieldset" data-registro-bloque th:each="rep, st : *{representantes}">
                            <legend>Persona representante</legend>
                            <div class="registro-grid">
                                <div class="form-group">
                                    <label class="form-label" th:for="|rep-${st.index}-nombre|">Nombre y apellido <span class="required" th:if="${st.first}">*</span></label>
                                    <input class="form-control" type="text" th:id="|rep-${st.index}-nombre|" th:name="|representantes[${st.index}].nombre|" th:value="${rep.nombre}" placeholder="Ej. Ana García" th:required="${st.first}" />
                                </div>
                                <div class="form-group">
                                    <label class="form-label" th:for="|rep-${st.index}-telefono|">Teléfono <span class="required" th:if="${st.first}">*</span></label>
                                    <input class="form-control" type="tel" th:id="|rep-${st.index}-telefono|" th:name="|representantes[${st.index}].telefono|" th:value="${rep.telefono}" placeholder="+54 11 1234-5678" th:required="${st.first}" />
                                </div>
                                <div class="form-group">
                                    <label class="form-label" th:for="|rep-${st.index}-correo|">Correo</label>
                                    <input class="form-control" type="email" th:id="|rep-${st.index}-correo|" th:name="|representantes[${st.index}].correo|" th:value="${rep.correo}" placeholder="ana@entidad.org" />
                                </div>
                            </div>
                            <button type="button" class="btn btn-outline js-only" data-registro-quitar th:hidden="${st.first}">Quitar esta persona</button>
                        </fieldset>
                    </div>
                    <p class="form-error" th:if="${#fields.hasErrors('representantes')}" th:errors="*{representantes}"></p>
                    <button type="button" class="btn btn-outline js-only" data-registro-agregar>Agregar otra persona representante</button>
                </fieldset>

                <fieldset class="registro-fieldset">
                    <legend>Acceso a la cuenta</legend>
                    <div class="form-group">
                        <label class="form-label" for="password">Contraseña <span class="required">*</span></label>
                        <input class="form-control" type="password" id="password" name="password" minlength="12" autocomplete="new-password" required />
                        <span class="form-hint">Mínimo 12 caracteres.</span>
                        <p class="form-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="confirmacion">Repetir contraseña <span class="required">*</span></label>
                        <input class="form-control" type="password" id="confirmacion" name="confirmacion" minlength="12" autocomplete="new-password" required />
                        <p class="form-error" th:if="${#fields.hasErrors('confirmacion')}" th:errors="*{confirmacion}"></p>
                    </div>
                </fieldset>

                <div class="registro-acciones">
                    <button type="submit" class="btn btn-primary registro-boton-envio">
                        <span>Registrar la entidad</span>
                    </button>
                </div>
            </form>
        </section>

        <script th:src="@{/js/registro.js}" defer></script>
    </main>
</body>
</html>
