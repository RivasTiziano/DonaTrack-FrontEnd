<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <body>
        <th:block th:fragment="contenido">
            <section th:if="${section == 'camion' and camion != null}" class="card api-panel">
                <h2 th:text="${camion.patente}">
                </h2>
                <span th:replace="~{fragments/admin-ui :: estado(${camion.estado})}">
                </span>
                <p th:text="'Carga: ' + ${camion.capacidadCarga} + ' kg; volumen: ' + ${camion.capacidadVolumen} + ' m³'">
                </p>
                <a th:href="@{/admin/dashboard/seguimiento/{patente}(patente=${camion.patente})}">Última ubicación GPS</a>
            </section>
            <section th:if="${section == 'entrega' and entrega != null}" class="card api-panel">
                <h2 th:text="'Entrega'">
                </h2>
                <span th:replace="~{fragments/admin-ui :: estado(${entrega.estado})}">
                </span>
                <p th:text="'Camión: ' + ${entrega.camionPatente}">
                </p>
                <p th:text="${entrega.justificacion}">
                </p>
                <h2>Referencias de fotografías</h2>
                <ul>
                    <li th:each="foto : ${entrega.fotos}" th:text="${foto}">
                    </li>
                </ul>
                
            </section>
            <section th:if="${section == 'ruta' and ruta != null}" class="card api-panel">
                <span th:replace="~{fragments/admin-ui :: estado(${ruta.estado})}">
                </span>
                <p th:text="'Fecha: ' + ${ruta.fecha}">
                </p>
                <p th:text="'Chofer: ' + ${ruta.chofer}">
                </p>
                <p th:text="'Distancia: ' + ${ruta.totalDistanciaKm} + ' km; duración: ' + ${ruta.totalDuracionMins} + ' minutos'">
                </p>
                <h2>Paradas</h2><p th:if="${ruta.paradas == null or ruta.paradas.isEmpty()}">Esta ruta todavía no tiene paradas.</p>
                <article th:each="p : ${ruta.paradas}">
                    <a th:href="@{/admin/dashboard/paradas/{id}(id=${p.id})}" th:text="'Parada ' + ${p.orden}">
                    </a>
                    <p th:if="${p.direccion != null}" th:text="${p.direccion.calle} + ' ' + ${p.direccion.numero} + ', ' + ${p.direccion.ciudad}">
                    </p>
                    <p th:text="'Llegada estimada: ' + ${p.estimatedArrivalTime}">
                    </p>
                </article>
            </section>
            <section th:if="${section == 'paradas'}" class="card api-panel">
                <p th:if="${paradas != null and paradas.isEmpty() and apiError == null}">No hay paradas.</p>
                <article th:each="p : ${paradas}">
                    <a th:href="@{/admin/dashboard/paradas/{id}(id=${p.id})}" th:text="'Parada ' + ${p.orden}">
                    </a>
                </article>
            </section>
            <section th:if="${section == 'parada' and parada != null}" class="card api-panel">
                <p th:if="${parada.direccion != null}" th:text="${parada.direccion.calle} + ' ' + ${parada.direccion.numero} + ', ' + ${parada.direccion.ciudad}">
                </p>
                <p th:text="'Llegada estimada: ' + ${parada.estimatedArrivalTime}">
                </p>
                <ul>
                    <li th:each="e : ${parada.entregas}">
                        <a th:href="@{/admin/dashboard/entregas/{id}(id=${e.id})}" th:text="${@adminEstados.etiqueta(e.estado)}">
                        </a>
                    </li>
                </ul>
            </section>
            <section th:if="${section == 'seguimiento'}" class="card api-panel">
                
                <a class="gps-refresh-link" th:href="@{/admin/dashboard/seguimiento}">Actualizar</a>
                <p th:if="${ubicaciones != null and ubicaciones.isEmpty() and apiError == null}">No hay ubicaciones registradas.</p>
                <div class="gps-layout gps-map-only">
                    <div class="admin-map" data-markers="gps-markers" role="region" aria-label="Mapa de últimas ubicaciones de camiones">
                    </div>
                    <div id="gps-markers" hidden>
                        <article class="attention-item" th:each="u : ${ubicaciones}" th:data-lat="${u.latitud}" th:data-lng="${u.longitud}">
                            <h3 th:text="${u.patente}">
                            </h3>
                            <dl class="truck-gps-details">
                                <div><dt>Avance</dt><dd th:text="${#numbers.formatDecimal(u.porcentajeAvance, 1, 1)} + '%'"></dd></div>
                                <div><dt>Próxima parada</dt><dd th:text="${u.proximaParadaDireccion != null ? u.proximaParadaDireccion : 'Sin próxima parada'}"></dd></div>
                                <div><dt>Actualizado</dt><dd th:text="${u.ultimaActualizacion != null ? #temporals.format(u.ultimaActualizacion, 'HH:mm · dd/MM/yyyy') : 'Sin actualización'}"></dd></div>
                                <div class="gps-coordinate"><dt>Latitud</dt><dd th:text="${u.latitud}"></dd></div>
                                <div class="gps-coordinate"><dt>Longitud</dt><dd th:text="${u.longitud}"></dd></div>
                            </dl>
                        </article>
                    </div>
                </div>
            </section>
            <section th:if="${section == 'ubicacion' and ubicacion != null}" class="card api-panel">
                <h2 th:text="${ubicacion.patente}">
                </h2>
                <p th:text="'Latitud: ' + ${ubicacion.latitud} + '; longitud: ' + ${ubicacion.longitud}">
                </p>
                <p th:text="'Velocidad: ' + ${ubicacion.velocidad} + '; última actualización: ' + ${ubicacion.ultimaActualizacion}">
                </p>
            </section>
        </th:block>
    </body>
</html>
