<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content, activeTab)">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:replace="${title}">DonaTrack - Panel Administrador</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/favicon.png}" />
    <!-- Local Leaflet & CSS -->
    <link rel="stylesheet" th:href="@{/vendor/leaflet/leaflet.css}" />
    <link rel="stylesheet" th:href="@{/css/index.css}" />
    <!-- Local Vendor Scripts -->
    <script th:src="@{/vendor/lucide/lucide.min.js}"></script>
    <script th:src="@{/vendor/leaflet/leaflet.js}"></script>
</head>
<body class="dashboard-shell admin-shell">
    <div class="admin-account-position">
        <details th:replace="~{fragments/account-menu :: menu}"></details>
    </div>
    <button type="button" class="dashboard-sidebar-toggle admin-mobile-toggle" aria-label="Abrir menú de navegación">
        <i data-lucide="menu" aria-hidden="true"></i>
    </button>
    <!-- Dashboard Mobile Drawer & Backdrop -->
    <div class="dashboard-mobile-backdrop" aria-hidden="true"></div>
    <aside class="dashboard-mobile-drawer" role="dialog" aria-modal="true" aria-label="Menú lateral móvil">
        <div class="dashboard-drawer-header">
            <div class="brand">
                <img th:replace="~{fragments/brand :: mark}" />
                <span>DonaTrack</span>
            </div>
            <button type="button" class="dashboard-drawer-close" aria-label="Cerrar menú">
                <i data-lucide="x"></i>
            </button>
        </div>

        <div class="dashboard-drawer-user-card">
            <div class="user-profile-name" th:text="${sesion != null ? sesion.nombreVisible : ''}"></div>
            <span class="role-badge">
                <i data-lucide="shield-check"></i>
                Administración
            </span>
        </div>

        <nav th:replace="~{fragments/admin-nav :: menu(${activeTab}, false)}"></nav>

        <div class="dashboard-drawer-footer">
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-outline">
                    <i data-lucide="log-out"></i>
                    <span>Cerrar sesión</span>
                </button>
            </form>
        </div>
    </aside>

    <div class="dashboard-body">
        <!-- Sidebar Navigation -->
        <aside class="dashboard-sidebar" aria-label="Navegación del panel de administración">
            <div class="admin-sidebar-controls">
                <a class="brand admin-sidebar-brand" th:href="@{/}" aria-label="DonaTrack - Inicio">
                    <img th:replace="~{fragments/brand :: mark}" />
                    <span>DonaTrack</span>
                </a>
                <button type="button" class="admin-sidebar-collapse" aria-label="Cerrar menú lateral" aria-expanded="true">
                    <i class="sidebar-close-icon" data-lucide="chevrons-left" aria-hidden="true"></i>
                    <i class="sidebar-open-icon" data-lucide="menu" aria-hidden="true"></i>
                </button>
            </div>
            <nav th:replace="~{fragments/admin-nav :: menu(${activeTab}, false)}"></nav>

            <div class="sidebar-footer">

            </div>
        </aside>

        <!-- Main Content View -->
        <main class="dashboard-main-content" role="main">
            <div th:replace="${content}"></div>
        </main>
    </div>

    <!-- Mobile Bottom Navigation -->
    <nav th:replace="~{fragments/admin-nav :: menu(${activeTab}, true)}"></nav>

    <!-- Global Toast Container -->
    <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

    <!-- Scripts -->
    <script th:src="@{/js/app-usability.js}"></script>
<script th:src="@{/js/ui-controls.js}"></script>
    <script th:src="@{/js/admin-ui.js}"></script>
    <script>
      if (window.lucide) {
        lucide.createIcons();
      }
    </script>
</body>
</html>
