<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content, activeTab)">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:replace="${title}">DonaTrack - Panel Entidad Beneficiaria</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/favicon.png}" />
    <!-- Local Leaflet & CSS -->
    <link rel="stylesheet" th:href="@{/vendor/leaflet/leaflet.css}" />
    <link rel="stylesheet" th:href="@{/css/index.css}" />
    <!-- Local Vendor Scripts -->
    <script th:src="@{/vendor/lucide/lucide.min.js}"></script>
    <script th:src="@{/vendor/leaflet/leaflet.js}"></script>
</head>
<body class="dashboard-shell">
    <!-- Header -->
    <header class="dashboard-header" role="banner">
        <div class="dashboard-header-left">
            <button type="button" class="dashboard-sidebar-toggle" aria-label="Abrir menú de navegación">
                <i data-lucide="menu" style="width: 22px; height: 22px;"></i>
            </button>
            <a class="brand" th:href="@{/}" aria-label="DonaTrack - Inicio">
                <img th:replace="~{fragments/brand :: mark}" />
                <span>DonaTrack</span>
            </a>

        </div>

        <div class="dashboard-header-right">


            <a th:href="@{/entidad/dashboard/notificaciones}" class="header-icon-btn" aria-label="Ver notificaciones" data-tooltip="Notificaciones">
                <i data-lucide="bell" style="width: 20px; height: 20px;"></i>
                <span class="notification-count-badge" th:if="${notificacionesNoLeidas != null and notificacionesNoLeidas > 0}" th:text="${notificacionesNoLeidas}"></span>
            </a>

            <details th:replace="~{fragments/account-menu :: menu}"></details>
        </div>
    </header>

    <!-- Dashboard Mobile Drawer & Backdrop -->
    <div class="dashboard-mobile-backdrop" aria-hidden="true"></div>
    <aside class="dashboard-mobile-drawer" role="dialog" aria-modal="true" aria-label="Menú lateral móvil">
        <div class="dashboard-drawer-header">
            <div class="brand">
                <img th:replace="~{fragments/brand :: mark}" />
                <span>DonaTrack</span>
            </div>
            <button type="button" class="dashboard-drawer-close" aria-label="Cerrar menú">
                <i data-lucide="x" style="width: 20px; height: 20px;"></i>
            </button>
        </div>

        <div class="dashboard-drawer-user-card">
            <div class="user-profile-name" th:text="${sesion != null ? sesion.nombreVisible : ''}"></div>
            <span class="role-badge" style="background: #e0e7ff; color: #4338ca; margin-top: 6px;">
                <i data-lucide="building-2" style="width: 12px; height: 12px;"></i>
                Entidad Beneficiaria
            </span>
        </div>

        <nav class="dashboard-drawer-nav">
            <a th:href="@{/entidad/dashboard}" th:classappend="${activeTab == 'inicio'} ? 'active' : ''" class="sidebar-link">
                <i data-lucide="layout-dashboard" style="width: 20px; height: 20px;"></i>
                <span>Resumen</span>
            </a>
            <a th:href="@{/entidad/dashboard/necesidades}" th:classappend="${activeTab == 'needs'} ? 'active' : ''" class="sidebar-link">
                <i data-lucide="clipboard-list" style="width: 20px; height: 20px;"></i>
                <span>Mis Necesidades</span>
            </a>
            <a th:href="@{/entidad/dashboard/donaciones}" th:classappend="${activeTab == 'donations'} ? 'active' : ''" class="sidebar-link">
                <i data-lucide="package-check" style="width: 20px; height: 20px;"></i>
                <span>Donaciones Asignadas</span>
            </a>
            <a th:href="@{/entidad/dashboard/confirmar}" th:classappend="${activeTab == 'confirm'} ? 'active' : ''" class="sidebar-link">
                <i data-lucide="camera" style="width: 20px; height: 20px;"></i>
                <span>Confirmar Recepción</span>
            </a>
            <a th:href="@{/entidad/dashboard/entregas}" th:classappend="${activeTab == 'deliveries'} ? 'active' : ''" class="sidebar-link">
                <i data-lucide="truck" style="width: 20px; height: 20px;"></i>
                <span>Seguimiento de Envíos</span>
            </a>
            <a th:href="@{/entidad/dashboard/notificaciones}" th:classappend="${activeTab == 'notifications'} ? 'active' : ''" class="sidebar-link">
                <i data-lucide="bell" style="width: 20px; height: 20px;"></i>
                <span>Notificaciones</span>
            </a>

        </nav>

        <div class="dashboard-drawer-footer">
            <form th:action="@{/logout}" method="post" style="display: block; width: 100%;">
                <button type="submit" class="btn btn-outline" style="width: 100%; justify-content: center; gap: 0.5rem;">
                    <i data-lucide="log-out" style="width: 16px; height: 16px;"></i>
                    <span>Cerrar sesión</span>
                </button>
            </form>
        </div>
    </aside>

    <div class="dashboard-body">
        <!-- Sidebar Navigation -->
        <aside class="dashboard-sidebar" aria-label="Navegación del panel de entidad">
            <nav class="sidebar-nav">
                <a th:href="@{/entidad/dashboard}" th:classappend="${activeTab == 'inicio'} ? 'active' : ''" class="sidebar-link">
                    <i data-lucide="layout-dashboard" style="width: 20px; height: 20px;"></i>
                    <span>Resumen</span>
                </a>
                <a th:href="@{/entidad/dashboard/necesidades}" th:classappend="${activeTab == 'needs'} ? 'active' : ''" class="sidebar-link">
                    <i data-lucide="clipboard-list" style="width: 20px; height: 20px;"></i>
                    <span>Mis Necesidades</span>
                </a>
                <a th:href="@{/entidad/dashboard/donaciones}" th:classappend="${activeTab == 'donations'} ? 'active' : ''" class="sidebar-link">
                    <i data-lucide="package-check" style="width: 20px; height: 20px;"></i>
                    <span>Donaciones Asignadas</span>
                </a>
                <a th:href="@{/entidad/dashboard/confirmar}" th:classappend="${activeTab == 'confirm'} ? 'active' : ''" class="sidebar-link">
                    <i data-lucide="camera" style="width: 20px; height: 20px;"></i>
                    <span>Confirmar Recepción</span>
                </a>
                <a th:href="@{/entidad/dashboard/entregas}" th:classappend="${activeTab == 'deliveries'} ? 'active' : ''" class="sidebar-link">
                    <i data-lucide="truck" style="width: 20px; height: 20px;"></i>
                    <span>Seguimiento de Envíos</span>
                </a>
                <a th:href="@{/entidad/dashboard/notificaciones}" th:classappend="${activeTab == 'notifications'} ? 'active' : ''" class="sidebar-link">
                    <i data-lucide="bell" style="width: 20px; height: 20px;"></i>
                    <span>Notificaciones</span>
                </a>
            </nav>

            <div class="sidebar-footer">

            </div>
        </aside>

        <!-- Main Content View -->
        <main class="dashboard-main-content" role="main">
            <p th:if="${apiError != null}" th:text="${apiError}" role="alert" style="padding: 1rem; border-radius: var(--radius-md); background: #fef2f2; color: #991b1b; margin-bottom: 1rem;"></p>
            <p th:if="${success != null}" th:text="${success}" role="status" style="padding: 1rem; border-radius: var(--radius-md); background: #ecfdf5; color: #065f46; margin-bottom: 1rem;"></p>
            <div th:replace="${content}"></div>
        </main>
    </div>

    <!-- Mobile Bottom Navigation -->
    <nav class="dashboard-bottom-nav" aria-label="Navegación móvil">
        <a th:href="@{/entidad/dashboard}" th:classappend="${activeTab == 'inicio'} ? 'active' : ''" class="bottom-nav-item">
            <i data-lucide="layout-dashboard" style="width: 18px; height: 18px;"></i>
            <span>Inicio</span>
        </a>
        <a th:href="@{/entidad/dashboard/necesidades}" th:classappend="${activeTab == 'needs'} ? 'active' : ''" class="bottom-nav-item">
            <i data-lucide="clipboard-list" style="width: 18px; height: 18px;"></i>
            <span>Necesidades</span>
        </a>
        <a th:href="@{/entidad/dashboard/donaciones}" th:classappend="${activeTab == 'donations'} ? 'active' : ''" class="bottom-nav-item">
            <i data-lucide="package-check" style="width: 18px; height: 18px;"></i>
            <span>Asignadas</span>
        </a>
        <a th:href="@{/entidad/dashboard/confirmar}" th:classappend="${activeTab == 'confirm'} ? 'active' : ''" class="bottom-nav-item">
            <i data-lucide="camera" style="width: 18px; height: 18px;"></i>
            <span>Confirmar</span>
        </a>
        <a th:href="@{/entidad/dashboard/entregas}" th:classappend="${activeTab == 'deliveries'} ? 'active' : ''" class="bottom-nav-item">
            <i data-lucide="truck" style="width: 18px; height: 18px;"></i>
            <span>Envíos</span>
        </a>
    </nav>

    <!-- Global Toast Container -->
    <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

    <!-- Scripts -->
    <script th:src="@{/js/app-usability.js}"></script>
<script th:src="@{/js/ui-controls.js}"></script>
    <script>
      if (window.lucide) {
        lucide.createIcons();
      }
    </script>
</body>
</html>
