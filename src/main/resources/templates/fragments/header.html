<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
</head>
<body>
    <!-- Top Bar Navigation Header -->
    <header th:fragment="header" class="dt-header" role="banner">
        <div class="dt-header-row">
            <a class="brand" th:href="@{/}" aria-label="DonaTrack - Inicio">
                <img th:replace="~{fragments/brand :: mark}" />
                <span>DonaTrack</span>
            </a>

            <nav class="dt-nav" aria-label="Navegación principal">
                <a th:href="@{/#about}">Acerca de</a>
                <a th:href="@{/#donations}">Donaciones</a>
                <a th:href="@{/#gallery}">Galería</a>
                <a th:href="@{/explorar-donaciones}">Explorar donaciones</a>
            </nav>

            <div class="auth-actions">
                <a th:href="@{/login}" class="nav-auth-link btn btn-ghost-primary">Iniciar sesión</a>
                <a th:href="@{/registro}" class="nav-auth-link btn btn-primary">Registrarse</a>
            </div>

            <!-- Mobile Hamburger Toggle Button -->
            <button type="button" class="mobile-menu-toggle" aria-label="Abrir menú de navegación">
                <i data-lucide="menu" style="width: 24px; height: 24px;"></i>
            </button>
        </div>
    </header>

    <!-- Mobile Navigation Drawer (Top-level under body for bulletproof fixed viewport positioning) -->
    <div th:fragment="mobileDrawer">
        <div class="mobile-nav-backdrop" aria-hidden="true"></div>
        <aside class="mobile-nav-drawer" role="dialog" aria-modal="true" aria-label="Menú móvil">
            <div class="mobile-drawer-header">
                <div class="brand">
                    <img th:replace="~{fragments/brand :: mark}" />
                    <span>DonaTrack</span>
                </div>
                <button type="button" class="mobile-drawer-close btn-icon" aria-label="Cerrar menú" style="background: none; border: none; cursor: pointer; display: grid; place-items: center; width: 36px; height: 36px; border-radius: var(--radius-sm);">
                    <i data-lucide="x" style="width: 22px; height: 22px;"></i>
                </button>
            </div>

            <div class="mobile-drawer-links">
                <a th:href="@{/#about}"><i data-lucide="info" style="width: 18px; height: 18px;"></i> Acerca de</a>
                <a th:href="@{/#donations}"><i data-lucide="package" style="width: 18px; height: 18px;"></i> Donaciones</a>
                <a th:href="@{/#gallery}"><i data-lucide="image" style="width: 18px; height: 18px;"></i> Galería</a>
                <a th:href="@{/explorar-donaciones}"><i data-lucide="map-pin" style="width: 18px; height: 18px;"></i> Explorar en Mapa</a>
                <a th:href="@{/legal}"><i data-lucide="shield-check" style="width: 18px; height: 18px;"></i> Legal y Privacidad</a>
            </div>

            <div style="display: flex; flex-direction: column; gap: 0.75rem; margin-top: auto; padding-top: 1.5rem; border-top: 1px solid var(--color-border);">
                <a th:href="@{/login}" style="width: 100%; text-decoration: none;" class="btn btn-outline">Iniciar sesión</a>
                <a th:href="@{/registro}" style="width: 100%; text-decoration: none;" class="btn btn-primary">Registrarse</a>
            </div>
        </aside>
    </div>
</body>
</html>
