<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <body>
        <th:block th:fragment="contenido">
            <section th:if="${section == 'rankings'}" class="rankings-section">
                <div class="podium" th:if="${ranking != null and !ranking.isEmpty() and ranking.?[misiones > 0].size() > 0}">
                    <article th:each="item,iter : ${ranking}" th:if="${iter.index < 3}">
                        <strong class="place" th:text="${item.posicion}">
                        </strong>
                        <h2 th:text="${item.nombre}">
                        </h2>
                        <p th:text="${item.misiones} + ' misiones'">
                        </p>
                    </article>
                </div>
                <p th:if="${ranking.isEmpty() and apiError == null}">No hay posiciones disponibles.</p>
                <div class="api-table">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th scope="col">Posición</th>
                                <th scope="col">Donante</th>
                                <th scope="col">Misiones resueltas</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item, fila : ${ranking}" th:if="${fila.index >= 3 or ranking.?[misiones > 0].isEmpty()}">
                                <td data-label="Posición">
                                    <span th:text="${item.posicion}">
                                    </span>
                                </td>
                                <td data-label="Donante">
                                    <span th:text="${item.nombre}">
                                    </span>
                                </td>
                                <td data-label="Misiones" class="numeric">
                                    <span th:text="${item.misiones}">
                                    </span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </th:block>
    </body>
</html>
