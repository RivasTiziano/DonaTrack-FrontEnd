<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content, activeTab)">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:replace="${title}">DonaTrack - Panel Donante</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/favicon.png}" />
    <!-- Local Leaflet & CSS -->
    <link rel="stylesheet" th:href="@{/vendor/leaflet/leaflet.css}" />
    <link rel="stylesheet" th:href="@{/css/index.css}" />
    <!-- Local Vendor Scripts -->
    <script th:src="@{/vendor/lucide/lucide.min.js}"></script>
    <script th:src="@{/vendor/leaflet/leaflet.js}"></script>
</head>
<body class="dashboard-shell admin-shell donor-shell">
    <button type="button" class="dashboard-sidebar-toggle admin-mobile-toggle" aria-label="Abrir menú de navegación"><i data-lucide="menu" aria-hidden="true"></i></button>
    <!-- Dashboard Mobile Drawer & Backdrop -->
    <div class="dashboard-mobile-backdrop" aria-hidden="true"></div>
    <aside class="dashboard-mobile-drawer" role="dialog" aria-modal="true" aria-label="Menú lateral móvil">
        <div class="dashboard-drawer-header">
            <div class="brand">
                <img th:replace="~{fragments/brand :: mark}" />
                <span>DonaTrack</span>
            </div>
            <button type="button" class="dashboard-drawer-close" aria-label="Cerrar menú">
                <i data-lucide="x" style="width: 20px; height: 20px;"></i>
            </button>
        </div>

        <div class="dashboard-drawer-user-card">
            <div class="user-profile-name" th:text="${sesion != null ? sesion.nombreVisible : ''}"></div>
            <span class="role-badge" style="margin-top: 6px;">
                <i data-lucide="user-check" style="width: 12px; height: 12px;"></i>
                Donante
            </span>
        </div>

        <nav class="dashboard-drawer-nav">
            <a th:href="@{/donante/dashboard}" th:classappend="${activeTab == 'inicio'} ? 'active' : ''" class="sidebar-link">
                <i data-lucide="layout-dashboard" style="width: 20px; height: 20px;"></i>
                <span>Resumen</span>
            </a>
            <a th:href="@{/donante/dashboard/donaciones}" th:classappend="${activeTab == 'donaciones'} ? 'active' : ''" class="sidebar-link">
                <i data-lucide="package" style="width: 20px; height: 20px;"></i>
                <span>Mis Donaciones</span>
            </a>
            <a th:href="@{/donante/dashboard/entidades}" th:classappend="${activeTab == 'entidades'} ? 'active' : ''" class="sidebar-link">
                <i data-lucide="building-2" style="width: 20px; height: 20px;"></i>
                <span>Entidades</span>
            </a>
            <a th:href="@{/donante/dashboard/incentivos}" th:classappend="${activeTab == 'incentivos'} ? 'active' : ''" class="sidebar-link">
                <i data-lucide="award" style="width: 20px; height: 20px;"></i>
                <span>Incentivos y Misiones</span>
            </a>
            <a th:href="@{/donante/dashboard/entregas}" th:classappend="${activeTab == 'entregas'} ? 'active' : ''" class="sidebar-link">
                <i data-lucide="map-pin" style="width: 20px; height: 20px;"></i>
                <span>Seguimiento de Entregas</span>
            </a>
            <a th:href="@{/donante/dashboard/notificaciones}" th:classappend="${activeTab == 'notificaciones'} ? 'active' : ''" class="sidebar-link">
                <i data-lucide="bell" style="width: 20px; height: 20px;"></i>
                <span>Notificaciones</span>
            </a>

        </nav>

        <div class="dashboard-drawer-footer">
            <form th:action="@{/logout}" method="post" style="display: block; width: 100%;">
                <button type="submit" class="sidebar-link sidebar-logout" aria-label="Cerrar sesión">
                    <i data-lucide="log-out" style="width: 16px; height: 16px;"></i>
                    <span>Cerrar sesión</span>
                </button>
            </form>
        </div>
    </aside>

    <div class="dashboard-body">
        <!-- Sidebar Navigation (Desktop & Tablet) -->
        <aside class="dashboard-sidebar" aria-label="Navegación del panel">
            <div class="admin-sidebar-controls">
                <a class="brand admin-sidebar-brand" th:href="@{/}" aria-label="DonaTrack - Inicio">
                    <img th:replace="~{fragments/brand :: mark}" />
                    <span>DonaTrack</span>
                </a>
                <button type="button" class="admin-sidebar-collapse" aria-label="Cerrar menú lateral" aria-expanded="true">
                    <i class="sidebar-close-icon" data-lucide="chevrons-left" aria-hidden="true"></i>
                    <i class="sidebar-open-icon" data-lucide="menu" aria-hidden="true"></i>
                </button>
            </div>
            <nav class="sidebar-nav admin-nav">
                <a th:href="@{/donante/dashboard}" th:classappend="${activeTab == 'inicio'} ? 'active' : ''" class="sidebar-link">
                    <i data-lucide="layout-dashboard" style="width: 20px; height: 20px;"></i>
                    <span>Resumen</span>
                </a>
                <a th:href="@{/donante/dashboard/donaciones}" th:classappend="${activeTab == 'donaciones'} ? 'active' : ''" class="sidebar-link">
                    <i data-lucide="package" style="width: 20px; height: 20px;"></i>
                    <span>Mis Donaciones</span>
                </a>
                <a th:href="@{/donante/dashboard/entidades}" th:classappend="${activeTab == 'entidades'} ? 'active' : ''" class="sidebar-link">
                    <i data-lucide="building-2" style="width: 20px; height: 20px;"></i>
                    <span>Entidades</span>
                </a>
                <a th:href="@{/donante/dashboard/incentivos}" th:classappend="${activeTab == 'incentivos'} ? 'active' : ''" class="sidebar-link">
                    <i data-lucide="award" style="width: 20px; height: 20px;"></i>
                    <span>Incentivos y Misiones</span>
                </a>
                <a th:href="@{/donante/dashboard/entregas}" th:classappend="${activeTab == 'entregas'} ? 'active' : ''" class="sidebar-link">
                    <i data-lucide="map-pin" style="width: 20px; height: 20px;"></i>
                    <span>Seguimiento de Entregas</span>
                </a>
                <a th:href="@{/donante/dashboard/notificaciones}" th:classappend="${activeTab == 'notificaciones'} ? 'active' : ''" class="sidebar-link">
                    <i data-lucide="bell" style="width: 20px; height: 20px;"></i>
                    <span>Notificaciones</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="sidebar-link sidebar-logout" aria-label="Cerrar sesión" title="Cerrar sesión">
                        <i data-lucide="log-out" aria-hidden="true"></i>
                        <span>Cerrar sesión</span>
                    </button>
                </form>
            </div>

        </aside>

        <!-- Main Content View -->
        <main class="dashboard-main-content" role="main">
            <p th:if="${apiError != null and activeTab != 'notificaciones'}" th:text="${apiError}" role="alert" style="padding: 1rem; border-radius: var(--radius-md); background: #fef2f2; color: #991b1b; margin-bottom: 1rem;"></p>
            <p th:if="${success != null}" th:text="${success}" role="status" style="padding: 1rem; border-radius: var(--radius-md); background: #ecfdf5; color: #065f46; margin-bottom: 1rem;"></p>
            <div th:replace="${content}"></div>
        </main>
    </div>

    <!-- Mobile Bottom Navigation -->
    <nav class="dashboard-bottom-nav" aria-label="Navegación móvil">
        <a th:href="@{/donante/dashboard}" th:classappend="${activeTab == 'inicio'} ? 'active' : ''" class="bottom-nav-item">
            <i data-lucide="layout-dashboard" style="width: 18px; height: 18px;"></i>
            <span>Inicio</span>
        </a>
        <a th:href="@{/donante/dashboard/donaciones}" th:classappend="${activeTab == 'donaciones'} ? 'active' : ''" class="bottom-nav-item">
            <i data-lucide="package" style="width: 18px; height: 18px;"></i>
            <span>Donaciones</span>
        </a>
        <a th:href="@{/donante/dashboard/entidades}" th:classappend="${activeTab == 'entidades'} ? 'active' : ''" class="bottom-nav-item">
            <i data-lucide="building-2" style="width: 18px; height: 18px;"></i>
            <span>Entidades</span>
        </a>
        <a th:href="@{/donante/dashboard/incentivos}" th:classappend="${activeTab == 'incentivos'} ? 'active' : ''" class="bottom-nav-item">
            <i data-lucide="award" style="width: 18px; height: 18px;"></i>
            <span>Incentivos</span>
        </a>
        <a th:href="@{/donante/dashboard/entregas}" th:classappend="${activeTab == 'entregas'} ? 'active' : ''" class="bottom-nav-item">
            <i data-lucide="map-pin" style="width: 18px; height: 18px;"></i>
            <span>Entregas</span>
        </a>
    </nav>

    <!-- Global Toast Container -->
    <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

    <!-- Scripts -->
    <script th:src="@{/js/app-usability.js}"></script>
<script th:src="@{/js/ui-controls.js}"></script>
<script th:src="@{/js/admin-ui.js}"></script>
<script th:src="@{/js/donor-ui.js}"></script>
    <script>
      if (window.lucide) {
        lucide.createIcons();
      }
    </script>
</body>
</html>
