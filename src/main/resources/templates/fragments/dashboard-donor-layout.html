<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content, activeTab)">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:replace="${title}">DonaTrack - Panel Donante</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}" />
    <!-- Local Leaflet & CSS -->
    <link rel="stylesheet" th:href="@{/vendor/leaflet/leaflet.css}" />
    <link rel="stylesheet" th:href="@{/css/index.css}" />
    <!-- Local Vendor Scripts -->
    <script th:src="@{/vendor/lucide/lucide.min.js}"></script>
    <script th:src="@{/vendor/leaflet/leaflet.js}"></script>
</head>
<body class="dashboard-shell">
    <!-- Header -->
    <header class="dashboard-header" role="banner">
        <div class="dashboard-header-left">
            <a class="brand" th:href="@{/}" aria-label="DonaTrack - Inicio">
                <span class="brand-mark" aria-hidden="true">
                    <i data-lucide="heart" style="width: 22px; height: 22px;"></i>
                </span>
                <span>DonaTrack</span>
            </a>
            <span class="role-badge">
                <i data-lucide="user-check" style="width: 12px; height: 12px;"></i>
                Donante
            </span>
        </div>

        <div class="dashboard-header-right">
            <div class="user-profile-summary">
                <span class="user-profile-name" th:text="${user != null ? user.name : 'Juan Pérez'}">Juan Pérez</span>
                <span class="user-profile-role" th:text="'Categoría: ' + (${user != null && user.category != null ? user.category : 'Sostenedor'})">Categoría: Sostenedor</span>
            </div>

            <a th:href="@{/donante/dashboard/notificaciones}" class="header-icon-btn" aria-label="Ver notificaciones" data-tooltip="Notificaciones">
                <i data-lucide="bell" style="width: 20px; height: 20px;"></i>
                <span class="notification-count-badge">2</span>
            </a>

            <a th:href="@{/}" style="text-decoration: none;" data-tooltip="Cerrar sesión">
                <button type="button" class="btn btn-outline btn-sm" style="color: var(--color-ink-light);">
                    <i data-lucide="log-out" style="width: 16px; height: 16px;"></i>
                    <span>Salir</span>
                </button>
            </a>
        </div>
    </header>

    <div class="dashboard-body">
        <!-- Sidebar Navigation (Desktop & Tablet) -->
        <aside class="dashboard-sidebar" aria-label="Navegación del panel">
            <nav class="sidebar-nav">
                <a th:href="@{/donante/dashboard}" th:classappend="${activeTab == 'inicio'} ? 'active' : ''" class="sidebar-link">
                    <i data-lucide="layout-dashboard" style="width: 20px; height: 20px;"></i>
                    <span>Resumen</span>
                </a>
                <a th:href="@{/donante/dashboard/donaciones}" th:classappend="${activeTab == 'donaciones'} ? 'active' : ''" class="sidebar-link">
                    <i data-lucide="package" style="width: 20px; height: 20px;"></i>
                    <span>Mis Donaciones</span>
                </a>
                <a th:href="@{/donante/dashboard/entidades}" th:classappend="${activeTab == 'entidades'} ? 'active' : ''" class="sidebar-link">
                    <i data-lucide="building-2" style="width: 20px; height: 20px;"></i>
                    <span>Entidades</span>
                </a>
                <a th:href="@{/donante/dashboard/incentivos}" th:classappend="${activeTab == 'incentivos'} ? 'active' : ''" class="sidebar-link">
                    <i data-lucide="award" style="width: 20px; height: 20px;"></i>
                    <span>Incentivos y Misiones</span>
                </a>
                <a th:href="@{/donante/dashboard/entregas}" th:classappend="${activeTab == 'entregas'} ? 'active' : ''" class="sidebar-link">
                    <i data-lucide="map-pin" style="width: 20px; height: 20px;"></i>
                    <span>Seguimiento de Entregas</span>
                </a>
                <a th:href="@{/donante/dashboard/notificaciones}" th:classappend="${activeTab == 'notificaciones'} ? 'active' : ''" class="sidebar-link">
                    <i data-lucide="bell" style="width: 20px; height: 20px;"></i>
                    <span>Notificaciones</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <a th:href="@{/explorar-donaciones}" class="btn btn-outline" style="width: 100%; font-size: 0.8125rem; min-height: 40px;">
                    <i data-lucide="map" style="width: 16px; height: 16px;"></i>
                    <span>Mapa Público</span>
                </a>
            </div>
        </aside>

        <!-- Main Content View -->
        <main class="dashboard-main-content" role="main">
            <div th:replace="${content}"></div>
        </main>
    </div>

    <!-- Mobile Bottom Navigation -->
    <nav class="dashboard-bottom-nav" aria-label="Navegación móvil">
        <a th:href="@{/donante/dashboard}" th:classappend="${activeTab == 'inicio'} ? 'active' : ''" class="bottom-nav-item">
            <i data-lucide="layout-dashboard" style="width: 18px; height: 18px;"></i>
            <span>Inicio</span>
        </a>
        <a th:href="@{/donante/dashboard/donaciones}" th:classappend="${activeTab == 'donaciones'} ? 'active' : ''" class="bottom-nav-item">
            <i data-lucide="package" style="width: 18px; height: 18px;"></i>
            <span>Donaciones</span>
        </a>
        <a th:href="@{/donante/dashboard/entidades}" th:classappend="${activeTab == 'entidades'} ? 'active' : ''" class="bottom-nav-item">
            <i data-lucide="building-2" style="width: 18px; height: 18px;"></i>
            <span>Entidades</span>
        </a>
        <a th:href="@{/donante/dashboard/incentivos}" th:classappend="${activeTab == 'incentivos'} ? 'active' : ''" class="bottom-nav-item">
            <i data-lucide="award" style="width: 18px; height: 18px;"></i>
            <span>Incentivos</span>
        </a>
        <a th:href="@{/donante/dashboard/entregas}" th:classappend="${activeTab == 'entregas'} ? 'active' : ''" class="bottom-nav-item">
            <i data-lucide="map-pin" style="width: 18px; height: 18px;"></i>
            <span>Entregas</span>
        </a>
    </nav>

    <!-- Global Toast Container -->
    <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

    <!-- Scripts -->
    <script th:src="@{/js/app-usability.js}"></script>
    <script>
      if (window.lucide) {
        lucide.createIcons();
      }
    </script>
</body>
</html>
