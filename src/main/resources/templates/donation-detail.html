<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head><title>Entrega pública - DonaTrack</title></head><body>
<main class="container detail-page" th:fragment="main">
 <a class="btn btn-outline" th:href="@{/#donations}">Volver a entregas</a>
 <article class="card api-panel" th:if="${donation != null}">
  <h1 th:text="${donation.title}">Entrega</h1>
  <p th:if="${#strings.startsWith(donation.title,'Prueba')}">Registro de prueba. La fotografía es ilustrativa, no evidencia de una entrega real.</p>
  <img th:if="${donation.image_url != null}" th:src="${donation.image_url}" th:alt="${donation.title}" class="public-delivery-photo" />
  <dl><dt>Fecha de entrega</dt><dd th:text="${donation.delivery_date}"></dd>
  <dt>Cantidad entregada</dt><dd th:each="item : ${donation.items}" th:text="${item.quantity}"></dd></dl>
 </article>
 <section class="card api-panel" th:if="${donation == null}"><h1>Entrega no disponible</h1><p>Este registro no está habilitado para consulta pública.</p></section>
</main></body></html>
