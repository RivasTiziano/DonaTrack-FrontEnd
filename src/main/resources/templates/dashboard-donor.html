<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/dashboard-donor-layout :: layout(~{::title}, ~{::main}, 'inicio')}">
<head><title>DonaTrack - Panel Donante</title></head>
<body><main th:fragment="main" class="donor-overview">
    <h1>Resumen</h1>
    <div class="donor-metrics">
        <div><span>Donaciones</span><strong th:text="${donorMetrics?.totalDonacionesHistoricas ?: 0}"></strong></div>
        <div><span>Categoría actual</span><strong th:text="${user?.category ?: 'Sin categoría asignada'}"></strong></div>
        <div><span>Impacto acumulado</span><strong th:text="${donorMetrics?.impactoAcumulado ?: 0}"></strong></div>
    </div>
    <section class="donor-section">
        <h2>Donaciones recientes</h2>
        <p th:if="${userDonations.isEmpty() and apiError == null}">Todavía no registraste donaciones.</p>
        <div class="donor-recent-row" th:each="donation : ${userDonations}" tabindex="0" th:data-row-url="@{/donante/dashboard/donaciones(modal=${donation.id})}" aria-label="Abrir donación">
            <img th:if="${donation.image_url != null}" th:src="${donation.image_url}" th:alt="${donation.title}" />
            <div><h3 th:text="${donation.title ?: 'Donación'}"></h3><span th:text="${donation.entity_name ?: 'Sin asignar'}"></span></div>
            <span class="status-badge" th:classappend="${donation.status_badge}" th:text="${donation.status_label}"></span>
            <strong th:text="${donation.total_units ?: 0} + ' ' + ${donation.unit ?: 'unidades'}"></strong>
        </div>
    </section>
    <section class="donor-section"><h2>Insignias</h2>
        <p th:if="${badges.isEmpty() and apiError == null}">Todavía no tenés insignias visibles.</p>
        <article class="donor-recent-row" th:each="badge : ${badges}"><i data-lucide="award" aria-hidden="true"></i><div><h3 th:text="${badge.name}"></h3><p th:text="${badge.description}"></p></div></article>
    </section>
</main></body></html>
