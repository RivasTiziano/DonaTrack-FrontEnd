# Application properties
spring.application.name=donatrack-frontend
server.port=${FRONTEND_PORT:8090}

apis.donaciones.url=${DONACIONES_API_URL:http://localhost:8080}
apis.logistica.url=${LOGISTICA_API_URL:http://localhost:8083}
apis.incentivos.url=${INCENTIVOS_API_URL:http://localhost:8082}
apis.notificaciones.url=${NOTIFICACIONES_API_URL:http://localhost:8081}
# Solo habilitar en desarrollo local. No sustituye autenticación/autorización.
app.notificaciones.envio-manual-habilitado=${NOTIFICACIONES_ENVIO_MANUAL_HABILITADO:false}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
