# Application properties
spring.application.name=donatrack-frontend
server.port=${FRONTEND_PORT:8090}

apis.donaciones.url=${DONACIONES_API_URL:http://localhost:8080}
apis.logistica.url=${LOGISTICA_API_URL:http://localhost:8083}
apis.incentivos.url=${INCENTIVOS_API_URL:http://localhost:8082}
apis.notificaciones.url=${NOTIFICACIONES_API_URL:http://localhost:8081}
apis.autenticacion.url=${AUTENTICACION_API_URL:http://localhost:8084}
# La sesión (con los tokens) viaja solo en la cookie, nunca en la URL (;jsessionid=...).
server.servlet.session.tracking-modes=cookie
# Solo habilitar en desarrollo local. No sustituye autenticación/autorización.
app.notificaciones.envio-manual-habilitado=${NOTIFICACIONES_ENVIO_MANUAL_HABILITADO:false}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB

# Monitoreo: Actuator queda en un puerto interno que no se publica en Docker/Render.
management.server.port=${MANAGEMENT_SERVER_PORT:9090}
management.server.address=${MANAGEMENT_SERVER_ADDRESS:127.0.0.1}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
# /livez y /readyz también se publican en el puerto HTTP normal.
management.endpoint.health.probes.add-additional-paths=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState
# No comprobar SMTP: una consulta de salud no debe abrir conexiones de correo.
management.health.mail.enabled=false
management.metrics.tags.application=frontend
