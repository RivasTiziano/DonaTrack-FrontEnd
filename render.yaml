services:
  - type: web
    name: donatrack-frontend
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /livez
    envVars:
      # Endpoint completo https://COLECTOR/v1/traces y cabecera authorization=Bearer TOKEN.
      # Define cómo activar y configurar el agente en Render.

      # 	Identifica este servicio como frontend en Jaeger.
      - key: OTEL_SERVICE_NAME
        value: frontend

        # 	Indica dónde enviar las trazas.
      - key: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
        sync: false

        # 	Incluye el token para acceder al colector.
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false

        # 	Define el formato de envío, http/protobuf.
      - key: OTEL_EXPORTER_OTLP_PROTOCOL
        value: http/protobuf

        # 	Deshabilitan esos exportadores en esta etapa.
      - key: OTEL_METRICS_EXPORTER
        value: none
      - key: OTEL_LOGS_EXPORTER
        value: none

        # 	Agrega trace_id y span_id a los logs de la aplicación.
      - key: LOGGING_PATTERN_LEVEL
        value: '%5p [trace_id=%X{trace_id:-} span_id=%X{span_id:-}]'

        #	Activa el agente al arrancar Java y conserva las opciones de memoria existentes.
      - key: JAVA_TOOL_OPTIONS
        value: "-javaagent:/opt/opentelemetry-javaagent.jar -Xms128m -Xmx220m -XX:+UseContainerSupport -XX:MaxRAMPercentage=65.0 -XX:+TieredCompilation -XX:TieredStopAtLevel=1 -Dspring.main.lazy-initialization=true"

      - key: DONACIONES_API_URL
        value: https://donatrack-donaciones-mtqa.onrender.com
      - key: LOGISTICA_API_URL
        value: https://donatrack-logistica-qogh.onrender.com
      - key: AUTENTICACION_API_URL
        value: https://donatrack-autenticacion.onrender.com
      - key: INCENTIVOS_API_URL
        value: https://donatrack-incentivos-cqnn.onrender.com
      - key: NOTIFICACIONES_API_URL
        value: https://donatrack-notificaciones-6sh2.onrender.com
